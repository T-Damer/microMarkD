name: microMarkD Simulator CI

on:
  push:
    branches:
      - agent/micromarkd-bootstrap
    paths:
      - '.github/workflows/simulator-ci.yml'
      - 'platformio.simulator.ini'
      - 'scripts/simulator_host_flags.py'
      - 'scripts/run_x4pro_simulator.py'
      - 'lib/**'
      - 'src/**'
  pull_request:
    paths:
      - '.github/workflows/simulator-ci.yml'
      - 'platformio.simulator.ini'
      - 'scripts/simulator_host_flags.py'
      - 'lib/**'
      - 'src/**'

concurrency:
  group: micromarkd-simulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build native X4 Pro simulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libssl-dev

      - name: Install PlatformIO Core
        run: python3 -m pip install -U platformio

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-simulator-${{ runner.os }}-${{ hashFiles('platformio.simulator.ini') }}
          restore-keys: pio-simulator-${{ runner.os }}-

      - name: Build simulator
        run: |
          pio run -c platformio.simulator.ini \
            -e micromarkd-x4pro-simulator
