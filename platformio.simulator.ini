[platformio]
build_cache_dir = .cache

; Native desktop build of microMarkD using uxjulia/crossink-simulator.
; It intentionally lives in a separate config so ESP32 firmware environments
; and their toolchains remain untouched.
[env:micromarkd-x4pro-simulator]
platform = native
lib_ldf_mode = deep+

; Firmware flashing is non-destructive in the simulator and these low-level
; ESP-only translation units cannot be built by the native host compiler.
build_src_filter =
  +<*>
  -<network/FirmwareFlasher.cpp>
  -<network/OtaBootSwitch.cpp>
  -<network/OtaUpdater.cpp>
  -<platform/skip_efuse_blk_check.c>

build_flags =
  -std=gnu++2a
  !sdl2-config --cflags --libs
  !python3 scripts/simulator_host_flags.py
  -DSIMULATOR
  -DSIMULATOR_DEVICE_X4_PRO
  -DMICROMARKD_APP=1
  -DCROSSPOINT_SIMULATOR_PROJECT_WEBSERVER
  -DCROSSPOINT_VERSION=\"dev-micromarkd-x4pro-simulator\"
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -DUSE_UTF8_LONG_NAMES=1
  -DPNG_MAX_BUFFERED_PIXELS=16416
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
  -Isrc

; The simulator supplies the host HAL and lightweight decoder shims.
lib_ignore = hal, PNGdec, JPEGDEC

extra_scripts =
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py

lib_deps =
  ; Pin the simulator revision used to validate this target.
  simulator=https://github.com/uxjulia/crossink-simulator.git#0c966429266dd9e9566e4f0822b2cdb12d612231
  FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
  Icons=symlink://freeink-sdk/libs/assets/Icons
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ ^0.0.1
  links2004/WebSockets @ 2.7.3
